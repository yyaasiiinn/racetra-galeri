<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Racetra Galeri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Düzen: üstte kerb şeritli başlık, altında arama/süzgeç satırı, pist kartları ızgarası; kart tıklanınca büyük harita + yükseklik profili paneli. */
:root{
  --bg:#eceff2; --surface:#ffffff; --ink:#14181d; --muted:#5b6672; --line:#d5dbe1;
  --road:#2c3239; --mapbg:#e3e8ec; --grid:#cfd6dd; --accent:#cf2f27; --accent-ink:#ffffff;
  --lo:#2f7fb8; --hi:#e8a42a; --ok:#1f8a54;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161a; --surface:#1b2026; --ink:#e9edf1; --muted:#98a3ae; --line:#2e353d;
  --road:#0b0e11; --mapbg:#232a31; --grid:#2f373f; --accent:#ee4a40; --accent-ink:#ffffff;
  --lo:#4aa0d8; --hi:#f0b440; --ok:#45bd82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161a; --surface:#1b2026; --ink:#e9edf1; --muted:#98a3ae; --line:#2e353d;
  --road:#0b0e11; --mapbg:#232a31; --grid:#2f373f; --accent:#ee4a40; --accent-ink:#ffffff;
  --lo:#4aa0d8; --hi:#f0b440; --ok:#45bd82; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1120px;margin-inline:auto;padding-block:0 48px}
header{padding-block:28px 18px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,6vw,3.4rem);line-height:1;letter-spacing:.01em;margin:0;text-transform:uppercase;text-wrap:balance}
.sub{margin:8px 0 0;color:var(--muted);max-width:52ch}
.kerb{height:10px;background:repeating-linear-gradient(90deg,var(--accent) 0 28px,var(--surface) 28px 56px);border-block:1px solid var(--line)}
.notice{margin:18px 0 0;padding:10px 14px;border:1px dashed var(--muted);border-radius:6px;font-size:13px;color:var(--muted)}
.notice b{color:var(--ink);font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-block:22px 18px}
.bar input[type=search]{flex:1 1 220px;min-width:0;padding:10px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:999px;font:500 13px var(--body);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{padding:9px 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;font:inherit}
.count{font:400 13px var(--mono);color:var(--muted);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;color:inherit;font:inherit}
.card:hover{border-color:var(--muted)}
.map{aspect-ratio:10/7;max-width:100%;background:var(--mapbg);display:block;width:100%}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h2{font-family:var(--display);font-size:1.5rem;font-weight:700;margin:0;line-height:1.1;text-transform:uppercase;letter-spacing:.01em}
.meta{font-size:13px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font:400 12.5px var(--mono)}
.stats span b{font-weight:500}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;padding:2px 8px;border-radius:4px;background:var(--mapbg);color:var(--muted)}
.empty{padding:40px 0;color:var(--muted)}
/* panel */
.veil{position:fixed;inset:0;background:rgba(10,12,15,.62);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;z-index:5}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:100%;max-width:980px;position:relative}
.panel .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:18px 20px 12px}
.panel h2{font-family:var(--display);font-size:clamp(1.8rem,5vw,2.6rem);margin:0;line-height:1;text-transform:uppercase}
.x{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:8px 12px;font:500 13px var(--body);cursor:pointer}
.pcols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;padding:0 20px 20px}
@media (max-width:760px){.pcols{grid-template-columns:minmax(0,1fr)}}
.bigmap{border-radius:8px;overflow:hidden;border:1px solid var(--line)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
dt{color:var(--muted)} dd{margin:0;font-family:var(--mono);font-size:13.5px;text-align:right}
.prof{margin-top:16px}
.prof h3{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.cta{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.btn{display:inline-block;text-decoration:none;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:12px 16px;font:600 15px var(--body);cursor:pointer}
.btn2{display:inline-block;margin-left:12px;color:var(--muted);font:500 14px var(--body)}
.btn:hover{filter:brightness(1.08)}
.how{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;min-height:2.6em}
.how.on{color:var(--ink);border-color:var(--ok)}
svg text{font-family:var(--mono)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Racetra Galeri</h1>
      <p class="sub">Racetra ile çizilen pistler. Birini seç, haritasına ve yükseklik profiline bak, programına ekle.</p>
    </div>
  </header>
  <div class="kerb" aria-hidden="true"></div>
  <p class="notice">Pist verileri gerçek pistlere göre yaklaşık değerlerdir, %100 birebir değildir. İndirmeden önce adının ve ölçülerinin sana uyduğuna bak.</p>

  <div class="bar">
    <input type="search" id="q" placeholder="Pist ara (ad, şehir, etiket)" aria-label="Pist ara">
    <div class="chips" role="group" aria-label="Gidiş yönü">
      <button class="chip" data-dir="all" aria-pressed="true">Hepsi</button>
      <button class="chip" data-dir="cw" aria-pressed="false">Saat yönü</button>
      <button class="chip" data-dir="ccw" aria-pressed="false">Ters yön</button>
    </div>
    <label class="meta" for="sort">Sırala</label>
    <select id="sort"><option value="name">Ada göre</option><option value="len">Uzunluğa göre</option><option value="elev">Yüksekliğe göre</option></select>
    <span class="count" id="count"></span>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div id="host"></div>

<script>
var TRACKS=[];
var $=function(s,r){return (r||document).querySelector(s)};
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function hex(c){c=c.replace('#','');return [0,2,4].map(function(i){return parseInt(c.substr(i,2),16)})}
function mix(a,b,t){var A=hex(a),B=hex(b);return 'rgb('+A.map(function(v,i){return Math.round(v+(B[i]-v)*t)}).join(',')+')'}

function spline(P,N){ // kapalı Catmull-Rom
  var n=P.length,out=[],per=Math.ceil(N/n);
  for(var i=0;i<n;i++){var p0=P[(i+n-1)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    for(var k=0;k<per;k++){var t=k/per,t2=t*t,t3=t2*t;
      out.push([0,1].map(function(d){return .5*((2*p1[d])+(-p0[d]+p2[d])*t+(2*p0[d]-5*p1[d]+4*p2[d]-p3[d])*t2+(-p0[d]+3*p1[d]-3*p2[d]+p3[d])*t3)}))}}
  return out}
function build(t){
  var P=t.pts,n=P.length,xs=P.map(function(p){return p[0]}),ys=P.map(function(p){return p[1]});
  var x0=Math.min.apply(0,xs),x1=Math.max.apply(0,xs),y0=Math.min.apply(0,ys),y1=Math.max.apply(0,ys);
  var k=Math.min(84/Math.max(x1-x0,1),54/Math.max(y1-y0,1)),cx=(x0+x1)/2,cy=(y0+y1)/2;
  var pts=P.map(function(p){return [50+(p[0]-cx)*k,35+(p[1]-cy)*k]});
  var el=P.map(function(p){return p[2]||0});
  var cur=pts.map(function(p,i){var a=pts[(i+n-2)%n],c=pts[(i+2)%n];var v1=[p[0]-a[0],p[1]-a[1]],v2=[c[0]-p[0],c[1]-p[1]];
    return Math.abs(v1[0]*v2[1]-v1[1]*v2[0])/((Math.hypot.apply(0,v1)*Math.hypot.apply(0,v2))||1)});
  var corners=0;for(var i=0;i<n;i++){var ok=cur[i]>0.10;for(var d=-6;d<=6&&ok;d++){if(cur[(i+d+n)%n]>cur[i])ok=false}if(ok)corners++}
  return {pts:pts,el:el,corners:corners}}
function prep(t){
  t.pit=t.pit==='left'?'Solda':'Sağda';t.tags=[];
  if(t.km<2)t.tags.push('kısa');if(t.km>=5)t.tags.push('uzun');
  if(t.relief>=30)t.tags.push('yokuşlu');else if(t.relief<8)t.tags.push('düz');
  if(t.width>=14)t.tags.push('geniş');
  t.author=t.author||'Bilinmiyor';t.city=t.city||t.country||'';
  t.g=build(t);return t}

function mapSVG(t,big){
  var g=t.g,pts=g.pts,n=pts.length,lo=css('--lo'),hi=css('--hi');
  var d='M'+pts.map(function(p){return p[0].toFixed(2)+','+p[1].toFixed(2)}).join('L')+(t.closed===false?'':'Z');
  var h='<svg class="'+(big?'bigmap-svg':'map')+'" viewBox="0 0 100 70" role="img" aria-label="'+t.name+' pist haritası" style="display:block;width:100%;height:auto;aspect-ratio:10/7;background:var(--mapbg)">';
  for(var x=10;x<100;x+=10)h+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="70" stroke="var(--grid)" stroke-width=".18"/>';
  for(var y=10;y<70;y+=10)h+='<line x1="0" y1="'+y+'" x2="100" y2="'+y+'" stroke="var(--grid)" stroke-width=".18"/>';
  h+='<path d="'+d+'" fill="none" stroke="var(--road)" stroke-width="'+(big?3.6:3.2)+'" stroke-linejoin="round"/>';
  for(var i=0;i<n;i++){var j=(i+1)%n;if(t.closed===false&&j===0)continue;var c=mix(lo,hi,g.el[i]/Math.max(t.relief,1));
    h+='<line x1="'+pts[i][0].toFixed(2)+'" y1="'+pts[i][1].toFixed(2)+'" x2="'+pts[j][0].toFixed(2)+'" y2="'+pts[j][1].toFixed(2)+'" stroke="'+c+'" stroke-width="1.15" stroke-linecap="round"/>'}
  // yön okları
  var cw=t.dir==="cw"; // pts sırası her zaman çizim yönünde; ters yönde diziyi ters oku
  for(var k=0;k<8;k++){var i=Math.floor(n*(k+.5)/8),a=pts[(i-2+n)%n],b=pts[(i+2)%n];
    var ang=Math.atan2(b[1]-a[1],b[0]-a[0]);if(!isDir(t))ang+=Math.PI;
    var p=pts[i];h+='<path d="M-1.3,-1.1L1.3,0L-1.3,1.1" transform="translate('+p[0].toFixed(2)+','+p[1].toFixed(2)+') rotate('+(ang*180/Math.PI).toFixed(1)+')" fill="none" stroke="#fff" stroke-width=".5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>'}
  // start çizgisi
  var a=pts[0],b=pts[3],ang2=Math.atan2(b[1]-a[1],b[0]-a[0])+Math.PI/2;
  h+='<line x1="'+(a[0]-Math.cos(ang2)*2.2).toFixed(2)+'" y1="'+(a[1]-Math.sin(ang2)*2.2).toFixed(2)+'" x2="'+(a[0]+Math.cos(ang2)*2.2).toFixed(2)+'" y2="'+(a[1]+Math.sin(ang2)*2.2).toFixed(2)+'" stroke="var(--accent)" stroke-width="1.1"/>';
  if(big)h+='<text x="'+(a[0]+3).toFixed(1)+'" y="'+(a[1]-3).toFixed(1)+'" font-size="2.6" fill="var(--ink)">START</text>';
  return h+'</svg>'}
// pts dizisi çizim sırasında; haritadaki oklar gidiş yönünü göstersin diye: dizi saat yönündeyse "cw" okları doğru, değilse ters
function isDir(t){var P=t.g.pts,A=0,n=P.length;for(var i=0;i<n;i++){var j=(i+1)%n;A+=P[i][0]*P[j][1]-P[j][0]*P[i][1]}
  var drawnCW=A>0; return (t.dir==="cw")===drawnCW}

function profSVG(t){
  var g=t.g,W=520,H=130,L=34,B=22,T=8,R=8,n=g.pts.length,max=Math.max(t.relief,10),
    X=function(i){return L+(W-L-R)*i/n},Y=function(v){return T+(H-T-B)*(1-v/max)};
  var lo=css('--lo'),hi=css('--hi');
  var h='<svg viewBox="0 0 '+W+' '+H+'" style="display:block;width:100%;height:auto" role="img" aria-label="Yükseklik profili">';
  [0,.5,1].forEach(function(f){var y=Y(max*f);h+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="var(--grid)" stroke-width="1"/><text x="'+(L-5)+'" y="'+(y+3.5)+'" font-size="10" text-anchor="end" fill="var(--muted)">'+Math.round(max*f)+' m</text>'});
  var path='M'+X(0)+','+Y(0);for(var i=0;i<n;i++)path+='L'+X(i).toFixed(1)+','+Y(g.el[i]).toFixed(1);path+='L'+X(n)+','+Y(g.el[0]).toFixed(1)+'L'+X(n)+','+Y(0)+'Z';
  h+='<path d="'+path+'" fill="'+mix(lo,hi,.5)+'" fill-opacity=".22"/>';
  var line='';for(var i=0;i<=n;i++)line+=(i?'L':'M')+X(i).toFixed(1)+','+Y(g.el[i%n]).toFixed(1);
  h+='<path d="'+line+'" fill="none" stroke="'+mix(lo,hi,.55)+'" stroke-width="2" stroke-linejoin="round"/>';
  for(var k=0;k<=4;k++){var km=t.km*k/4;h+='<text x="'+(L+(W-L-R)*k/4)+'" y="'+(H-6)+'" font-size="10" text-anchor="'+(k==0?'start':k==4?'end':'middle')+'" fill="var(--muted)">'+km.toFixed(1)+' km</text>'}
  return h+'</svg>'}

var state={dir:'all',q:'',sort:'name'};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function render(){
  var list=TRACKS.filter(function(t){
    if(state.dir!=='all'&&t.dir!==state.dir)return false;
    var q=state.q.toLowerCase();return !q||(t.name+' '+t.city+' '+t.tags.join(' ')).toLowerCase().indexOf(q)>=0});
  list.sort(function(a,b){return state.sort==='len'?b.km-a.km:state.sort==='elev'?b.relief-a.relief:a.name.localeCompare(b.name,'tr')});
  $('#count').textContent=list.length+' / '+TRACKS.length+' pist';
  $('#grid').innerHTML=list.length?list.map(function(t){
    return '<button class="card" data-id="'+t.id+'" aria-label="'+esc(t.name)+' ayrıntılarını aç">'+mapSVG(t,false)+
    '<div class="body"><h2>'+esc(t.name)+'</h2><div class="meta">'+esc(t.city)+' · '+esc(t.author)+'</div>'+
    '<div class="stats"><span><b>'+t.km.toFixed(1)+'</b> km</span><span><b>'+t.g.corners+'</b> viraj</span><span>+<b>'+t.relief+'</b> m</span><span>'+(t.dir==='cw'?'↻ saat yönü':'↺ ters yön')+'</span></div>'+
    '<div class="tags">'+t.tags.map(function(x){return '<span class="tag">'+esc(x)+'</span>'}).join('')+'</div></div></button>'}).join(''):
    '<p class="empty">Aramana uyan pist yok. Aramayı kısalt ya da yönü “Hepsi” yap.</p>'}
function openPanel(id){
  var t=TRACKS.filter(function(x){return x.id===id})[0];if(!t)return;
  $('#host').innerHTML='<div class="veil" id="veil"><div class="panel" role="dialog" aria-modal="true" aria-label="'+esc(t.name)+'"><div class="top"><div><h2>'+esc(t.name)+'</h2><div class="meta">'+esc(t.city)+' · yazan '+esc(t.author)+'</div></div><button class="x" id="close">Kapat</button></div>'+
  '<div class="pcols"><div><div class="bigmap">'+mapSVG(t,true)+'</div><div class="prof"><h3>Yükseklik profili (start çizgisinden başlar)</h3>'+profSVG(t)+'</div></div>'+
  '<div><dl><dt>Uzunluk</dt><dd>'+(t.km*1000).toFixed(0)+' m</dd><dt>Asfalt genişliği</dt><dd>'+t.width+' m</dd><dt>Viraj sayısı</dt><dd>'+t.g.corners+'</dd><dt>Yükseklik farkı</dt><dd>'+t.relief+' m</dd><dt>Gidiş yönü</dt><dd>'+(t.dir==='cw'?'saat yönü':'saat yönünün tersi')+'</dd><dt>Pit yolu</dt><dd>'+t.pit+'</dd><dt>Dosya boyutu</dt><dd>~'+t.size+' MB</dd></dl>'+
  '<div class="cta"><a class="btn" id="add" href="racetra://install?name='+encodeURIComponent(t.id)+'&zip='+encodeURIComponent(new URL(t.zip,location.href).href)+'">Oyuna otomatik kur</a><a class="btn2" id="dl" href="'+esc(t.zip)+'" download>Sadece zip indir ('+t.size+' MB)</a><div class="how on" id="how">Otomatik kurulum için bilgisayarında Racetra yüklü olmalı; tarayıcı "Racetra açılsın mı?" diye sorar, onayla. Elle kurmak istersen zip içindeki <b>'+esc(t.id)+'</b> klasörünü <b>content/tracks</b> klasörüne kopyala. Veriler gerçek pistle birebir olmayabilir.</div></div></div></div></div></div>';
  $('#close').focus();
  $('#close').onclick=closePanel;
  $('#veil').addEventListener('click',function(e){if(e.target.id==='veil')closePanel()})}
function closePanel(){$('#host').innerHTML=''}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closePanel()});
$('#grid').addEventListener('click',function(e){var c=e.target.closest('.card');if(c)openPanel(c.getAttribute('data-id'))});
$('#q').addEventListener('input',function(e){state.q=e.target.value;render()});
$('#sort').addEventListener('change',function(e){state.sort=e.target.value;render()});
document.querySelectorAll('.chip').forEach(function(b){b.addEventListener('click',function(){
  state.dir=b.getAttribute('data-dir');document.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});render()})});
function load(){fetch('galeri.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){TRACKS=(j.tracks||[]).map(prep);render()}).catch(function(){$('#grid').innerHTML='<p class="empty">Pist listesi yüklenemedi (galeri.json bulunamadı). Sayfayı yenile.</p>'})}
load();
// tema değişince elevasyon renkleri yeniden çizilsin
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render)}catch(e){}
try{new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(e){}
</script>

</body>
</html>
